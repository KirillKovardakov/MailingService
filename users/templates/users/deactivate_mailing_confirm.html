{% extends 'mailing/base.html' %}
{% block title %}Отключение рассылки{% endblock %}

{% block content %}
<h2>Отключить рассылку</h2>
<p>Вы уверены, что хотите отключить рассылку "<strong>{{ mailing }}</strong>"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Отключить</button>
    <a href="{% url 'mailing:mailings_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
