<!-- templates/mailing/messages_list.html -->
{% extends 'mailing/base.html' %}
{% block title %}Сообщения{% endblock %}


{% block content %}
<h2>Сообщения</h2>
<a href="{% url 'mailing:message_create' %}" class="btn btn-success mb-3">Добавить сообщение</a>
<table class="table table-striped">
    <thead>
    <tr>
        <th>Тема</th>
        <th>Дата</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    {% for m in messages_list %}
    <tr>
        <td>{{ m.subject }}</td>
        <td>{{ m.created_at }}</td>
        <td>
            <a href="{% url 'mailing:message_edit' m.id %}" class="btn btn-sm btn-primary">Изменить</a>
            <a href="{% url 'mailing:message_delete' m.id %}" class="btn btn-sm btn-danger">Удалить</a>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="3">Нет сообщений</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
