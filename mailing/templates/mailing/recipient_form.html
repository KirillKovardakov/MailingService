<!-- templates/mailing/recipient_form.html -->
{% extends 'mailing/base.html' %}
{% block title %}Получатель{% endblock %}


{% block content %}
<h2>{% if object %}Редактировать{% else %}Добавить{% endif %} получателя</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'mailing:recipients_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
